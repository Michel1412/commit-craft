name: "Commit Breaker"
description: "O grafico de contribuicoes do ultimo ano vira Block Breaker ou Pac-Man no README."
author: "Michel Bocchi Junior"
branding:
  icon: box
  color: purple

inputs:
  github_user_name:
    description: "Usuario GitHub cujo calendario anual de contribuicoes (no GitHub inteiro) vira os objetivos do jogo."
    required: true
  github_token:
    description: "Token para ler o calendario. O GITHUB_TOKEN padrao ve contribuicoes publicas."
    required: false
    default: ${{ github.token }}
  extension:
    description: "Peca da fabrica: block-breaker ou pac-man. Rode a Action duas vezes (um step por jogo) para publicar os dois no README."
    required: false
    default: "block-breaker"
  out_dir:
    description: "Pasta de saida relativa ao repositorio que chama a Action."
    required: false
    default: "dist"
  source:
    description: "user = calendario anual no GitHub inteiro. repo = commits das ultimas 52 semanas de um repositorio."
    required: false
    default: "user"
  repository:
    description: "owner/name quando source=repo. Vazio usa o repositorio da Action."
    required: false
    default: ""
  theme:
    description: "Tema visual. Basicos: roxo (default do Block Breaker), cinza, branco, azul, vermelho, rosa, ciano, verde. Games: minecraft, pacman (oficial do Pac-Man)."
    required: false
    default: "roxo"

outputs:
  svg_path:
    description: "SVG autoplay para o README (Block Breaker ou Pac-Man, conforme a extensao)."
    value: ${{ steps.generate.outputs.svg_path }}
  html_path:
    description: "HTML jogavel. Clique para focar. Block Breaker: A/D ou setas. Pac-Man: WASD ou setas."
    value: ${{ steps.generate.outputs.html_path }}

runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        INPUT_GITHUB_USER_NAME: ${{ inputs.github_user_name }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_EXTENSION: ${{ inputs.extension }}
        INPUT_OUT_DIR: ${{ inputs.out_dir }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_THEME: ${{ inputs.theme }}
        COMMIT_BREAKER_ACTION_PATH: ${{ github.action_path }}
      run: node "$COMMIT_BREAKER_ACTION_PATH/src/cli.js"
