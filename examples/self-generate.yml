# Workflow desta propria fabrica (regenera dist/).
# Copie para .github/workflows/generate.yml se o token do git tiver scope `workflow`.

name: generate

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "action.yml"
      - "preview/build.mjs"
      - ".github/workflows/generate.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Block Breaker
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extension: block-breaker
          out_dir: dist
          # Jogos: block-breaker, pac-man
          # Temas:
          #   Basicos: roxo (default), cinza, branco, azul, vermelho, rosa, ciano, verde
          #   Games:   minecraft, pacman (oficial do Pac-Man)
          theme: roxo
      - name: Generate Pac-Man
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          extension: pac-man
          out_dir: dist
          theme: pacman
      - name: Generate preview gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node preview/build.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist preview
          if git diff --cached --quiet; then
            echo "Sem mudanca visual"
            exit 0
          fi
          git commit -m "chore: regenera os jogos dos commits anuais"
          git push
